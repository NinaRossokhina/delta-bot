name: Channel voice
on:
  workflow_dispatch:  # run by hand after updating style/result.json
permissions:
  contents: write
jobs:
  style:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q openai
      - run: python style/build_style.py
      - run: python style/analyze_style.py
        env:
          POLZA_API_KEY: ${{ secrets.POLZA_API_KEY }}
      - run: bash save_state.sh "Update channel voice (style/)" style/posts.txt style/my-voice.md style/examples.md costs.jsonl
