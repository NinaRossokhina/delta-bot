name: AI tasks
on:
  schedule:
    - cron: "45 4 * * *"  # 07:45 Moscow (UTC+3); GitHub may start it a bit late
  workflow_dispatch:
    inputs:
      task:
        description: 'Task JSON (see ai.py). {"kind": "daily"} = черновики на сегодня'
        required: true
        default: '{"kind": "daily"}'
permissions:
  contents: write
  actions: write
jobs:
  ai:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q openai
      # ffmpeg converts voice messages to mp3 if Polza does not take ogg (usually preinstalled)
      - if: contains(github.event.inputs.task, '"voice"')
        run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - id: ai
        run: python ai.py
        env:
          TASK: ${{ github.event.inputs.task }}  # empty for the schedule: ai.py runs the morning daily task
          POLZA_API_KEY: ${{ secrets.POLZA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_CHAT_ID: "813825039"
      # Bot state the task changed: a reason for feedback.md (an answer to «Почему?»), image prompts
      # for «Другая картинка» (images.jsonl), what the requests cost (costs.jsonl, for /cost)
      - if: always() && steps.ai.outcome != 'skipped'
        run: bash save_state.sh "Bot state from AI tasks" feedback.md images.jsonl voice_edited.jsonl costs.jsonl
      # Daily drafts: commit the new file, then start send.yml for it
      # (a push made with GITHUB_TOKEN does not trigger other workflows by itself).
      - if: always() && steps.ai.outputs.file != ''
        env:
          FILE: ${{ steps.ai.outputs.file }}
          GH_TOKEN: ${{ github.token }}
        run: |
          bash save_state.sh "Drafts for $(basename "$FILE" .json)" "$FILE"
          gh workflow run send.yml --ref main -f file="$FILE"
      # ai.py reports its own failures; this covers saving and sending the drafts.
      - if: failure() && steps.ai.outcome == 'success' && steps.ai.outputs.file != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_CHAT_ID: "813825039"
        run: |
          python -c 'from tg import call; from ai import ADMIN, FAILED_TODAY
          call("sendMessage", chat_id=ADMIN, text=FAILED_TODAY.format("не удалось сохранить черновики в репозиторий или запустить их отправку"))'
