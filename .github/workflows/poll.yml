name: Publish approved posts
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
concurrency: poll
permissions:
  contents: write
  actions: write
jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      ADMIN_CHAT_ID: "813825039"
      CHANNEL_ID: "@delta24news"
      GITHUB_TOKEN: ${{ github.token }}
      AI_ENABLED: ${{ secrets.POLZA_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - run: python poll.py
      - name: Save the queue
        run: bash save_state.sh "Update bot state" queue.json pending.json slots.json feedback.md style/examples.md
      - name: Confirm processed updates
        run: if [ -f .confirm_offset ]; then python poll.py --confirm "$(cat .confirm_offset)"; fi
