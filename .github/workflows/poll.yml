name: Publish approved posts
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
concurrency: poll
jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python poll.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_CHAT_ID: "813825039"
          CHANNEL_ID: "@delta24news"
